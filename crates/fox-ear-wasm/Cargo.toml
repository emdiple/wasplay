[package]
name = "fox-ear-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
ebur128 = "0.1"
symphonia = { version = "0.6", default-features = false, features = [
    "mp3", "aac", "flac", "vorbis", "pcm", "wav", "ogg", "isomp4",
] }

